[project]
name = "interview-avatar-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai]~=1.9",
    "livekit-plugins-bey~=1.9",
    "livekit-plugins-noise-cancellation~=0.3",
    "livekit-plugins-silero~=1.9",
    "livekit-plugins-turn-detector~=1.9",
    "python-dotenv>=1.2.1",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
