# Render Blueprint — https://render.com/docs/blueprint-spec
# Service URLs below assume the default service names; adjust if you rename them.

databases:
  - name: interview-avatar-db
    plan: free
    databaseName: interview_avatar
    user: interview_avatar

services:
  # Static frontend (React + Vite)
  - type: web
    name: interview-avatar-frontend
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    routes:
      # SPA: let React Router handle deep links like /report/<id>
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://interview-avatar-backend.onrender.com

  # FastAPI backend
  - type: web
    name: interview-avatar-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: interview-avatar-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://interview-avatar-frontend.onrender.com
      - key: AGENT_API_KEY
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  # LiveKit agent (background worker)
  - type: worker
    name: interview-avatar-agent
    runtime: python
    buildCommand: >-
      pip install uv &&
      cd agent && uv sync --frozen --no-dev &&
      uv run --no-dev python agent.py download-files
    startCommand: cd agent && uv run --no-dev python agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BACKEND_URL
        value: https://interview-avatar-backend.onrender.com
      - key: AGENT_API_KEY
        fromService:
          type: web
          name: interview-avatar-backend
          envVarKey: AGENT_API_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: BEY_API_KEY
        sync: false
      - key: BEY_AVATAR_ID
        sync: false
