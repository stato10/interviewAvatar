# Adds a local LiveKit server for development. Only OPENAI_API_KEY is required in .env.
#   docker compose -f compose.yaml -f compose.livekit.yaml up --build
# Browser → ws://localhost:7880 ; backend/agent → ws://livekit:7880 (Docker network).

services:
  livekit:
    image: livekit/livekit-server:v1.9.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # signalling (WebSocket)
      - "7881:7881" # WebRTC over TCP (fallback)
      - "7882:7882/udp" # WebRTC over UDP (single muxed port)

  backend:
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-local-only-0123456789abcdef
    depends_on:
      - livekit

  agent:
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-local-only-0123456789abcdef
      ENABLE_NOISE_CANCELLATION: "false" # BVC is LiveKit Cloud only
    depends_on:
      - livekit
