# Local development LiveKit server (NOT for production: well-known dev key).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # Advertise loopback so a browser on the same machine can reach the media ports.
  node_ip: 127.0.0.1
keys:
  devkey: devsecret-local-only-0123456789abcdef
logging:
  level: info
